# 1Password's Electron runtime multiplies GNOME's text-scaling-factor (set by
# `omarchy display text size`) into its device scale, but its SSH/CLI approval
# and unlock prompts are a fixed, unresizable size, so their content gets cut
# off. Serving it default gsettings makes it render at the plain monitor scale.
# The env can't go in ~/.config/autostart (1Password rewrites that file).
# See omacom/omarchy#2016, #8574, #8575.
[Service]
Environment=GSETTINGS_BACKEND=memory
